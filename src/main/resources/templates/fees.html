<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Fees')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('fees')}"></aside>
    <main class="content">
        <header class="page-header">
            <div>
                <div class="eyebrow">Ledger</div>
                <h1>Fees</h1>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" onclick="showFeeModal()">+ Add fee record</button>
            </div>
        </header>

        <div class="card">
            <div class="filter-bar">
                <form method="get" th:action="@{/fees}" class="filter-form">
                    <div class="filter-group">
                        <label for="studentFilter">Student</label>
                        <select id="studentFilter" name="studentId" onchange="this.form.submit()">
                            <option value="">All</option>
                            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName}" th:selected="${s.id == selectedStudentId}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="classFilter">Class</label>
                        <select id="classFilter" name="classFilter" onchange="this.form.submit()">
                            <option value="">All</option>
                            <option th:each="c : ${classes}" th:value="${c}" th:text="${c}" th:selected="${c == selectedClass}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="nameFilter">Student name</label>
                        <input id="nameFilter" type="search" name="name" th:value="${name}" placeholder="Search by name"/>
                    </div>
                    <button class="btn btn-ghost btn-sm" type="submit">Search</button>
                    <a th:href="@{/fees}" class="btn btn-ghost btn-sm" th:if="${selectedStudentId != null or selectedClass != null or !#strings.isEmpty(name)}">Clear</a>
                </form>
            </div>
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Student</th>
                        <th>Term</th>
                        <th>Due</th>
                        <th>Paid</th>
                        <th>Outstanding</th>
                        <th>Status</th>
                        <th sec:authorize="hasRole('admin')">Record payment</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${fees}">
                        <td class="font-medium" th:text="${f.student.fullName}"></td>
                        <td th:text="${f.term}"></td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(f.amountDue, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(f.amountPaid, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(f.outstanding, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td><span class="fee-status" th:classappend="'fee-' + ${f.status}" th:text="${f.status}"></span></td>
                        <td sec:authorize="hasRole('admin')">
                            <form th:action="@{/fees/{id}/pay(id=${f.id})}" method="post" class="pay-row">
                                <input type="number" name="amount" placeholder="Amount" step="0.01" min="0.01" required/>
                                <button class="btn btn-success btn-sm" type="submit">Pay</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(fees)}">
                        <td colspan="7" class="empty-cell">No fee records yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Add Fee Modal -->
<div id="feeModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeFeeModal()">
    <div class="modal-card">
        <h2>Add fee record</h2>
        <form th:action="@{/fees/new}" method="post">
            <div class="modal-scroll">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="feeStudent">Student</label>
                        <select id="feeStudent" name="studentId" required>
                            <option value="">Select student</option>
                            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="feeTerm">Term</label>
                        <input id="feeTerm" name="term" type="text" required placeholder="e.g. Term 1 2026"/>
                    </div>
                    <div class="form-group">
                        <label for="feeAmountDue">Amount due</label>
                        <input id="feeAmountDue" name="amountDue" type="number" step="0.01" min="0.01" required/>
                    </div>
                    <div class="form-group">
                        <label for="feeAmountPaid">Amount paid</label>
                        <input id="feeAmountPaid" name="amountPaid" type="number" step="0.01" min="0" value="0"/>
                    </div>
                    <div class="form-group">
                        <label for="feeDueDate">Due date</label>
                        <input id="feeDueDate" name="dueDate" type="date"/>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" onclick="closeFeeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
function showFeeModal() {
    document.getElementById('feeModal').style.display = 'flex';
}

function closeFeeModal() {
    document.getElementById('feeModal').style.display = 'none';
}
</script>
</body>
</html>
