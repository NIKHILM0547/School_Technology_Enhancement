<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Full roll call')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('attendance')}"></aside>
    <main class="content">
        <header class="page-header">
            <div>
                <div class="eyebrow">Roll call</div>
                <h1>Mark attendance</h1>
                <div class="text-muted">Staff roll call - mark students and teachers</div>
            </div>
            <div class="page-actions">
                <form method="get" th:action="@{/attendance/rollcall-staff}">
                    <input type="date" name="date" th:value="${selectedDate}" onchange="this.form.submit()"/>
                </form>
            </div>
        </header>

        <div class="flash flash-success" th:if="${param.saved}" style="margin-bottom:16px;">
            Attendance saved for <strong th:text="${selectedDate}"></strong>.
        </div>

        <form th:action="@{/attendance/save-staff}" method="post">
            <input type="hidden" name="date" th:value="${selectedDate}"/>

            <div class="card">
                <div class="card-header">
                    <h2>Students</h2>
                    <span class="badge" th:text="${#lists.size(students)}">0</span>
                </div>
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Student</th>
                            <th>Class</th>
                            <th class="col-status">Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${students}">
                            <td class="font-medium" th:text="${s.fullName}"></td>
                            <td th:text="${s.classDisplay}"></td>
                            <td>
                                <input type="hidden" name="studentIds" th:value="${s.id}"/>
                                <div class="pill-group">
                                    <div th:each="st : ${statuses}"
                                         th:class="'status-pill' + (${studentMarks.get(s.id) == st} ? ' selected pill-' + ${st} : '')"
                                         th:text="${st}"
                                         onclick="selectPill(this)"></div>
                                </div>
                                <input type="hidden" th:id="'student_status_'+${s.id}" name="studentStatuses"
                                       th:value="${studentMarks.get(s.id)}"/>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="3" class="empty-cell">No students registered yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Teachers</h2>
                    <span class="badge" th:text="${#lists.size(staff)}">0</span>
                </div>
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Teacher</th>
                            <th>Email</th>
                            <th class="col-status">Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${staff}">
                            <td class="font-medium" th:text="${u.name}"></td>
                            <td class="text-muted" th:text="${u.email}"></td>
                            <td>
                                <input type="hidden" name="staffIds" th:value="${u.id}"/>
                                <div class="pill-group">
                                    <div th:each="st : ${statuses}"
                                         th:class="'status-pill' + (${staffMarks.get(u.id) == st} ? ' selected pill-' + ${st} : '')"
                                         th:text="${st}"
                                         onclick="selectPill(this)"></div>
                                </div>
                                <input type="hidden" th:id="'staff_status_'+${u.id}" name="staffStatuses"
                                       th:value="${staffMarks.get(u.id)}"/>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(staff)}">
                            <td colspan="3" class="empty-cell">No teachers registered yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <button class="btn btn-primary" type="submit" style="margin-top:4px;">
                Save attendance
            </button>
        </form>
        <p class="text-muted" style="margin-top:12px;">
            <a th:href="@{/attendance}">&larr; Back to attendance list</a>
        </p>
    </main>
</div>

<script>
function selectPill(el) {
    var parent = el.parentElement;
    var pills = parent.querySelectorAll('.status-pill');
    pills.forEach(function(p) { p.className = 'status-pill'; });
    el.className = 'status-pill selected pill-' + el.textContent.trim();
    parent.nextElementSibling.value = el.textContent.trim();
}
</script>
</body>
</html>
