<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — EduAdmin'">EduAdmin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</div>

<div th:fragment="sidebar(activePage)">
    <button type="button" class="menu-toggle" aria-label="Toggle menu" onclick="toggleSidebar()">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="sidebar" id="appSidebar">
    <div class="brand">
        <div class="brand-mark">Ed</div>
        <span class="brand-name">EduAdmin</span>
    </div>
    <nav class="nav">
        <div class="nav-label">Main</div>
        <a th:href="@{/}" class="nav-link" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span> Dashboard
        </a>
        <a th:href="@{/attendance}" class="nav-link" th:classappend="${activePage == 'attendance'} ? ' active' : ''" sec:authorize="hasAnyRole('admin','teacher','student')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M9 16l2 2 4-4"/></svg></span> Attendance
        </a>
        <a th:href="@{/attendance/leave}" class="nav-link" th:classappend="${activePage == 'leave'} ? ' active' : ''" sec:authorize="hasAnyRole('admin','teacher','student')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/></svg></span> Leave
        </a>
        <a th:href="@{/fees}" class="nav-link" th:classappend="${activePage == 'fees'} ? ' active' : ''" sec:authorize="hasAnyRole('admin','student')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 8h12M6 13l8.5 8M6 13h3c5.667 0 7.667-10 0-10"/></svg></span> Fees
        </a>
        <a th:href="@{/fees/structure}" class="nav-link" th:classappend="${activePage == 'fees-structure'} ? ' active' : ''" sec:authorize="hasRole('admin')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg></span> Fee Structure
        </a>
        <a th:href="@{/users}" class="nav-link" th:classappend="${activePage == 'users'} ? ' active' : ''" sec:authorize="hasAnyRole('admin','teacher')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Users
        </a>
        <a th:href="@{/reviews}" class="nav-link" th:classappend="${activePage == 'reviews'} ? ' active' : ''">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span> Reviews & Discussion
        </a>
        <a th:href="@{/notes}" class="nav-link" th:classappend="${activePage == 'notes'} ? ' active' : ''">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg></span> Notes & Material
        </a>
        <a th:href="@{/reportcards}" class="nav-link" th:classappend="${activePage == 'reportcards'} ? ' active' : ''" sec:authorize="hasAnyRole('admin','teacher')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M12 12v6M9 15h6"/></svg></span> Report Cards
        </a>
        <a th:href="@{/marks}" class="nav-link" th:classappend="${activePage == 'marks'} ? ' active' : ''" sec:authorize="hasAnyRole('admin','teacher','student')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span> Marks
        </a>
        <a th:href="@{/remarks}" class="nav-link" th:classappend="${activePage == 'remarks'} ? ' active' : ''" sec:authorize="hasAnyRole('admin','teacher')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/><path d="M9 9h6M9 13h4"/></svg></span> Class Remarks
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-chip">
            <div class="user-name" th:text="${currentUserName} ?: 'User'">User</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-ghost btn-sm" type="submit">Log out</button>
        </form>
    </div>
    </div>

    <script>
        function toggleSidebar() {
            var s = document.getElementById('appSidebar');
            var o = document.getElementById('sidebarOverlay');
            var open = s.classList.toggle('open');
            o.classList.toggle('open', open);
            document.body.classList.toggle('no-scroll', open);
        }
        function closeSidebar() {
            document.getElementById('appSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
            document.body.classList.remove('no-scroll');
        }
    </script>
</div>

</body>
</html>
